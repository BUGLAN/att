appId: com.att.audio-to-text
productName: Audio to Text
directories:
  buildResources: build
  output: release

# 打进 asar 的内容：只放代码，绝不放用户数据与模型。
# 注意：data/（含 .encryption_key 解密密钥）与 models/（10GB+）**绝对不能**进包，
# 否则等于把解密密钥与密文一起分发（API Key 明文泄漏）。
files:
  - dist/**/*
  - electron/**/*
  - app/**/*.py
  - package.json

# 解包到 resources/ 的内容：Python 运行时、后端代码、提示词预设。
# 运行期只读依赖：python-dist（解释器+依赖）、app（后端源码）、prompts（提示词预设）。
extraResources:
  - from: python-dist
    to: python
    filter:
      - "**/*"
  - from: app
    to: app
    filter:
      - "**/*.py"
  # 提示词预设必须随包分发：app/prompts/file_manager.py 按 <repo>/resources/prompts 定位，
  # 漏掉这一项会导致打包版提示词预设为 0 个、LLM 优化直接失效。
  - from: prompts
    to: prompts
    filter:
      - "**/*.txt"

mac:
  category: public.app-category.productivity
  icon: electron/icons/icon.icns
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  icon: electron/icons/icon.ico
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
