<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATT 桌面端 UI 重构 · 原型</title>
<!--
  【原型 · 用完即弃】桌面端主窗口 UI 重构
  范围：外壳（导航）+ 首页（录音）/ 转文字 / 记录集 / 剪贴板；不含悬浮窗与设置页。
  主题参考：设置页（深灰底、唯一金色强调、分组标签「— 标题」、行式卡片、状态 = 小圆点 + 灰字、
            不用徽章胶囊、加载/进行中用底边流动的金色细线）。
  三个结构不同的变体，用 ?variant=A|B|C 切换（底部切换条或键盘 ← →），页面用 ?page=home|transcribe|records|clipboard。
    A 设置同构：与设置页同一套骨架——侧边导航 + 标题区 + 分组卡片 + 行列表
    B 主从分栏：图标导航条 + 列表 | 详情 两栏，录音条常驻首页顶部
    C 专注单列：无侧栏，顶部文字标签导航，居中单列，像在读一份文档
  全部数据为假数据，只在内存里；所有操作都是演示，不连后端。
-->
<style>
:root {
  color-scheme: dark;
  /* —— 以下令牌与 src/styles/tokens.css 同值 —— */
  --gray-950: #0a0a0b; --gray-900: #111113; --gray-850: #18181b; --gray-800: #1f1f23;
  --gray-700: #2d2d32; --gray-600: #3f3f46; --gray-500: #52525b; --gray-400: #71717a; --gray-300: #a1a1aa;
  --bg-base: var(--gray-950); --bg-surface: var(--gray-900); --bg-card: var(--gray-850);
  --bg-raise: var(--gray-800); --bg-hover: var(--gray-700);
  --line: var(--gray-800); --line-strong: var(--gray-700); --line-soft: rgba(255,255,255,.06);
  --text-1: #f4f4f5; --text-2: #9d9da6; --text-3: #8b8b96; --text-4: #5f5f69;
  --accent: #c9a227; --accent-hi: #dcb63a; --accent-ink: #1a1400;
  --accent-veil: rgba(201,162,39,.06); --accent-faint: rgba(201,162,39,.10); --accent-dim: rgba(201,162,39,.15);
  --accent-tint: rgba(201,162,39,.22); --accent-line: rgba(201,162,39,.30); --accent-line-strong: rgba(201,162,39,.42);
  --ok: #4ade80; --warn: #f5a524; --err: #f87171; --info: #60a5fa;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-6: 24px; --s-8: 32px; --s-12: 48px;
  --r-sm: 6px; --r-md: 10px; --r-lg: 16px; --r-xl: 24px; --r-full: 9999px;
  --fs-cap: 12px; --fs-sm: 13px; --fs-base: 14px; --fs-md: 15px; --fs-lg: 18px; --fs-xl: 24px; --fs-2xl: 32px;
  --t-fast: 150ms; --t-base: 250ms; --ease: cubic-bezier(.4,0,.2,1);
  --edge-hi: inset 0 1px 0 rgba(255,255,255,.04);
  --font-sans: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'SF Mono', Menlo, Consolas, 'Cascadia Mono', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg-base); color: var(--text-1); font: 14px/1.6 var(--font-sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: rgba(161,161,170,.22); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: rgba(201,162,39,.6); }

/* ================= 共用原子（所有变体共享，等于未来的设计系统） ================= */
.win { position: fixed; inset: 0; display: flex; flex-direction: column; }
.titlebar { height: 34px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px; -webkit-app-region: drag; }
.titlebar i { width: 11px; height: 11px; border-radius: 50%; background: var(--gray-700); }
.body { flex: 1; min-height: 0; display: flex; }
.scroll { overflow-y: auto; min-height: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--text-3); }
.cap { font-size: var(--fs-cap); }
.icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* 状态 = 小圆点 + 灰字（不做成胶囊徽章） */
.meta { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-cap); color: var(--text-3); white-space: nowrap; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dot, var(--text-3)); flex: none; }
.dot.ok { --dot: var(--ok); } .dot.warn { --dot: var(--warn); } .dot.err { --dot: var(--err); }
.dot.gold { --dot: var(--accent); } .dot.pulse { animation: pulse 1.4s var(--ease) infinite; }
@keyframes pulse { 50% { opacity: .3; } }

/* 分组标签：与设置页「— 输入设备」同款 */
.label { display: flex; align-items: center; gap: 8px; margin: 0 0 var(--s-3); font-size: var(--fs-cap); font-weight: 600; letter-spacing: .15em; color: var(--text-2); }
.label::before { content: ''; width: 14px; height: 1px; background: linear-gradient(90deg, var(--accent), transparent); }
.label .aside { margin-left: auto; letter-spacing: 0; font-weight: 400; color: var(--text-3); }

/* 按钮：全局只有「录音」是金色实心；其余都是安静的文字/图标按钮 */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: var(--r-sm); color: var(--text-2); font-size: var(--fs-sm); transition: background var(--t-fast), color var(--t-fast); white-space: nowrap; }
.btn:hover { background: var(--bg-raise); color: var(--text-1); }
.btn.gold { color: var(--accent); }
.btn.gold:hover { background: var(--accent-faint); color: var(--accent-hi); }
.btn.line { border: 1px solid var(--line-strong); }
.ibtn { width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: var(--r-sm); color: var(--text-3); transition: background var(--t-fast), color var(--t-fast); }
.ibtn:hover { background: var(--bg-raise); color: var(--text-1); }
.ibtn.on { color: var(--accent); }
.ibtn.danger:hover { color: var(--err); background: rgba(248,113,113,.08); }

/* 流动的金色细线：进行中 / 加载中统一用它（贴在容器底边） */
.flow { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--accent-faint); overflow: hidden; pointer-events: none; }
.flow::after { content: ''; position: absolute; top: 0; bottom: 0; width: 38%; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: sweep 1.5s var(--ease) infinite; }
.flow.top { top: 0; bottom: auto; }
@keyframes sweep { from { left: -38%; } to { left: 100%; } }

/* 下划线式标签（替代胶囊筛选） */
.tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line); }
.tabs button { position: relative; padding: 8px 0 10px; font-size: var(--fs-sm); color: var(--text-3); }
.tabs button:hover { color: var(--text-1); }
.tabs button.on { color: var(--text-1); }
.tabs button.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px; }
.tabs .n { margin-left: 4px; color: var(--text-4); font-size: var(--fs-cap); }

/* 搜索框 */
.search { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-md); color: var(--text-3); }
.search:focus-within { border-color: var(--accent-line); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font-size: var(--fs-sm); color: var(--text-1); }
.search input::placeholder { color: var(--text-4); }
.kbd { font: 11px var(--font-mono); color: var(--text-4); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; }

/* 开关（设置页同款） */
.toggle { position: relative; width: 40px; height: 24px; flex: none; border-radius: var(--r-full); background: var(--gray-700); border: 1px solid var(--line-soft); transition: background var(--t-base); }
.toggle::before { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--gray-300); transition: transform var(--t-base), background var(--t-base); }
.toggle.on { background: var(--accent); }
.toggle.on::before { transform: translateX(16px); background: #fff; }

/* 假下拉 */
.select { display: inline-flex; align-items: center; justify-content: space-between; gap: 10px; height: 34px; min-width: 160px; padding: 0 10px 0 12px; background: var(--bg-raise); border: 1px solid var(--line-strong); border-radius: var(--r-md); color: var(--text-1); font-size: var(--fs-sm); }
.select .icon { width: 14px; height: 14px; color: var(--text-3); }
.select.inline { height: auto; min-width: 0; padding: 0 2px; background: none; border: 0; border-bottom: 1px dashed var(--accent-line-strong); border-radius: 0; color: var(--accent); }

/* 行：设置页 setting-item 的同款底 */
.row { position: relative; display: flex; align-items: center; gap: var(--s-4); padding: var(--s-3) var(--s-4); background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-md); transition: border-color var(--t-fast), background var(--t-fast); }
.row + .row { margin-top: var(--s-2); }
.row .grow { flex: 1; min-width: 0; }
.row .title { font-size: var(--fs-base); font-weight: 500; }
.row .desc { font-size: var(--fs-cap); color: var(--text-3); }
.hover-actions { display: flex; gap: 2px; opacity: 0; transition: opacity var(--t-fast); }
.row:hover .hover-actions, .item:hover .hover-actions, .hover-actions.show { opacity: 1; }

.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.clamp3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* 录音按钮：全应用唯一的金色实心控件 */
.rec-btn { position: relative; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 6px var(--accent-faint); transition: transform var(--t-fast), box-shadow var(--t-base), background var(--t-base); }
.rec-btn:hover { transform: scale(1.03); background: var(--accent-hi); }
.rec-btn .icon { stroke-width: 2; }
.rec-btn.recording { background: var(--bg-raise); color: var(--accent); box-shadow: 0 0 0 1px var(--accent-line-strong), 0 0 0 8px var(--accent-veil); }
.rec-btn.recording::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 1px solid var(--accent-line); animation: ring 1.6s var(--ease) infinite; }
.rec-btn.processing { background: var(--bg-raise); color: var(--text-3); box-shadow: 0 0 0 1px var(--line-strong); }
@keyframes ring { from { transform: scale(.92); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }

/* 声纹：录音时流动，空闲时静止成一条细线 */
.wave { display: flex; align-items: center; gap: 3px; height: 28px; align-self: center; }
.wave i { width: 2px; height: 3px; border-radius: 2px; background: var(--gray-600); transition: height .12s; }
.wave.live i { background: var(--accent); animation: wv 1s ease-in-out infinite; }
.wave.live i:nth-child(3n) { animation-delay: -.3s; } .wave.live i:nth-child(3n+1) { animation-delay: -.6s; } .wave.live i:nth-child(4n) { animation-duration: .8s; }
@keyframes wv { 0%,100% { height: 4px; } 50% { height: 24px; } }

.live-cursor::after { content: ''; display: inline-block; width: 2px; height: 1em; margin-left: 2px; vertical-align: -2px; background: var(--accent); animation: pulse 1s steps(1) infinite; }
.pending-text { color: var(--text-3); }

/* 剪贴板图片占位（假图） */
.thumb { border-radius: var(--r-sm); background: var(--g, linear-gradient(135deg,#2d2d32,#18181b)); border: 1px solid var(--line); flex: none; }

/* 空态 */
.empty { display: grid; place-items: center; gap: 6px; padding: 48px 0; color: var(--text-3); font-size: var(--fs-sm); text-align: center; }

/* Toast：一行灰字 + 小圆点，底部居中 */
.toast { position: fixed; left: 50%; bottom: 72px; transform: translate(-50%, 8px); opacity: 0; display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--bg-raise); border: 1px solid var(--line-strong); border-radius: var(--r-full); font-size: var(--fs-sm); color: var(--text-1); transition: opacity var(--t-base), transform var(--t-base); pointer-events: none; z-index: 50; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 原型切换条：故意用高对比白色胶囊，和被评审的设计区分开 */
.proto-bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 100; display: flex; align-items: center; gap: 4px; padding: 4px; background: #f4f4f5; color: #111; border-radius: 999px; box-shadow: 0 8px 30px rgba(0,0,0,.6); font: 12px/1 system-ui, sans-serif; }
.proto-bar button { height: 28px; min-width: 28px; padding: 0 10px; border-radius: 999px; color: #111; font-weight: 600; }
.proto-bar button:hover { background: #e4e4e7; }
.proto-bar .lbl { padding: 0 8px; font-weight: 600; white-space: nowrap; }
.proto-bar .lbl small { font-weight: 400; color: #52525b; margin-left: 6px; }

/* ================= 变体 A：设置同构 ================= */
.vA .side { width: 208px; flex: none; display: flex; flex-direction: column; padding: 6px 12px 14px; border-right: 1px solid var(--line); }
.vA .brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 18px; font-weight: 600; letter-spacing: .02em; }
.vA .brand b { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(140deg, var(--accent), #8a6d12); }
.vA .nav button { width: 100%; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: var(--r-md); color: var(--text-2); font-size: var(--fs-base); }
.vA .nav button:hover { background: var(--bg-card); color: var(--text-1); }
.vA .nav button.on { background: var(--accent-dim); color: var(--accent); }
.vA .nav button + button { margin-top: 2px; }
.vA .nav hr { border: 0; border-top: 1px solid var(--line); margin: 10px 4px; }
.vA .side-foot { margin-top: auto; padding: 0 8px; display: grid; gap: 6px; }
.vA .main { flex: 1; min-width: 0; }
.vA .page { max-width: 960px; margin: 0 auto; padding: 18px 40px 96px; }
.vA .crumb { font-size: var(--fs-cap); color: var(--text-3); }
.vA h1 { margin: 2px 0 4px; font-size: var(--fs-xl); font-weight: 600; letter-spacing: .01em; }
.vA .lead { margin: 0 0 var(--s-6); font-size: var(--fs-sm); color: var(--text-2); }
.vA .section { position: relative; background: var(--bg-surface); border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--edge-hi); overflow: hidden; }
.vA .section + .section { margin-top: var(--s-4); }
.vA .group { padding: var(--s-6); }
.vA .group + .group { border-top: 1px solid var(--line); }
.vA .recorder { display: flex; align-items: center; gap: var(--s-6); }
.vA .recorder .rec-btn { width: 64px; height: 64px; }
.vA .recorder .rec-btn .icon { width: 24px; height: 24px; }
.vA .recorder .timer { font-size: 28px; line-height: 1; letter-spacing: .04em; }
.vA .recorder .readout { display: grid; gap: 8px; min-width: 120px; }
.vA .recorder .side-meta { margin-left: auto; display: grid; justify-items: end; gap: 6px; }
.vA .live { margin-top: var(--s-4); padding: var(--s-4); min-height: 64px; background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-md); font-size: var(--fs-md); line-height: 1.75; }
.vA .rec-row { cursor: pointer; align-items: flex-start; }
.vA .rec-row .hover-actions { margin-top: -4px; }
.vA .rec-row:hover { border-color: var(--line-strong); }
.vA .rec-row .time { width: 46px; flex: none; padding-top: 2px; font-size: var(--fs-cap); color: var(--text-3); }
.vA .rec-row .text { font-size: var(--fs-base); line-height: 1.65; color: var(--text-1); }
.vA .rec-row .meta-col { display: flex; align-items: center; gap: 10px; flex: none; }
.vA .rec-row .meta-col > .mono { width: 34px; text-align: right; }
.vA .rec-row.open { border-color: var(--accent-line); }
.vA .rec-detail { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-4); margin-top: var(--s-3); }
.vA .rec-detail h4 { margin: 0 0 4px; font-size: var(--fs-cap); font-weight: 500; color: var(--text-3); }
.vA .rec-detail p { margin: 0; font-size: var(--fs-sm); line-height: 1.7; color: var(--text-2); }
.vA .rec-detail p.opt { color: var(--text-1); }
.vA .day { margin: var(--s-6) 0 var(--s-2); font-size: var(--fs-cap); color: var(--text-3); }
.vA .day:first-child { margin-top: 0; }
.vA .toolbar { display: flex; align-items: center; gap: var(--s-3); margin-bottom: var(--s-4); }
.vA .toolbar .search { flex: 1; }
.vA .drop { position: relative; display: flex; align-items: center; gap: var(--s-4); padding: var(--s-6); border: 1px dashed var(--line-strong); border-radius: var(--r-md); background: var(--bg-card); cursor: pointer; transition: border-color var(--t-fast); }
.vA .drop:hover { border-color: var(--accent-line-strong); }
.vA .drop .ico { width: 40px; height: 40px; display: grid; place-items: center; border-radius: var(--r-md); background: var(--bg-raise); color: var(--accent); }
.vA .clip-row .ico { width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--r-sm); background: var(--bg-raise); color: var(--text-3); flex: none; }
.vA .clip-row .text { font-size: var(--fs-sm); color: var(--text-1); }
.vA .result { font-size: var(--fs-md); line-height: 1.85; }
.vA .seg-list { display: grid; gap: 10px; }
.vA .seg-list div { display: grid; grid-template-columns: 92px 1fr; gap: 12px; font-size: var(--fs-sm); }

/* ================= 变体 B：主从分栏 ================= */
.vB .rail { width: 60px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0 14px; border-right: 1px solid var(--line); }
.vB .rail .logo { width: 26px; height: 26px; margin-bottom: 14px; border-radius: 8px; background: linear-gradient(140deg, var(--accent), #8a6d12); }
.vB .rail button { position: relative; width: 40px; height: 40px; display: grid; place-items: center; border-radius: var(--r-md); color: var(--text-3); }
.vB .rail button:hover { background: var(--bg-card); color: var(--text-1); }
.vB .rail button.on { color: var(--accent); background: var(--accent-faint); }
.vB .rail button.on::before { content: ''; position: absolute; left: -10px; top: 10px; bottom: 10px; width: 2px; border-radius: 2px; background: var(--accent); }
.vB .rail button .icon { width: 18px; height: 18px; }
.vB .rail button[data-tip]:hover::after { content: attr(data-tip); position: absolute; left: 48px; top: 50%; transform: translateY(-50%); padding: 4px 8px; background: var(--bg-raise); border: 1px solid var(--line-strong); border-radius: var(--r-sm); font-size: var(--fs-cap); color: var(--text-1); white-space: nowrap; z-index: 5; }
.vB .rail .spacer { flex: 1; }
.vB .content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.vB .strip { position: relative; flex: none; display: flex; align-items: center; gap: var(--s-4); height: 76px; padding: 0 var(--s-6); border-bottom: 1px solid var(--line); background: var(--bg-surface); }
.vB .strip .rec-btn { width: 44px; height: 44px; box-shadow: 0 0 0 4px var(--accent-faint); }
.vB .strip .rec-btn .icon { width: 18px; height: 18px; }
.vB .strip .timer { font-size: 20px; width: 64px; }
.vB .strip .ticker { flex: 1; min-width: 0; font-size: var(--fs-md); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
.vB .strip .ticker span { direction: ltr; unicode-bidi: plaintext; }
.vB .split { flex: 1; min-height: 0; display: flex; }
.vB .list { width: 360px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
.vB .list-head { padding: var(--s-4) var(--s-4) 0; display: grid; gap: var(--s-3); }
.vB .list-head h2 { margin: 0; display: flex; align-items: baseline; gap: 8px; font-size: var(--fs-lg); font-weight: 600; }
.vB .list-head h2 small { font-size: var(--fs-cap); font-weight: 400; color: var(--text-3); }
.vB .list .tabs { padding: 0 var(--s-4); }
.vB .items { flex: 1; padding: var(--s-2); }
.vB .item { position: relative; display: flex; gap: 10px; padding: 10px 12px; border-radius: var(--r-md); cursor: pointer; }
.vB .item:hover { background: var(--bg-card); }
.vB .item.on { background: var(--bg-card); }
.vB .item.on::before { content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 2px; border-radius: 2px; background: var(--accent); }

      </div>
    </div>`
    const body = tf.phase === 'empty' || tf.phase === 'ready'
      ? `<div class="detail-body"><div class="drop" onclick="startTf()">
          <div style="display:grid;justify-items:center;gap:10px">
            <span style="color:var(--accent)">${icon('upload', '')}</span>
            ${tf.phase === 'empty' ? '<div style="color:var(--text-1)">拖入音视频文件，或点击选择</div><div class="cap">也可以 ⌘V 粘贴本地路径</div>'
              : '<div style="color:var(--text-1)" class="mono">weekly-review-1030.mp4</div><div class="cap mono">24:16 · 186 MB</div><button class="btn gold line" style="margin-top:6px" onclick="event.stopPropagation();startTf()">开始转写</button>'}
          </div></div></div>`
      : `<div class="detail-head" style="position:relative"><span class="meta mono">weekly-review-1030.mp4</span>
          ${tf.phase === 'running' ? '<span class="meta" style="margin-left:auto"><span class="dot gold pulse"></span>转写中 38%</span><div class="flow"></div>'
            : `<div class="tabs" style="border:0;margin-left:24px">${[['text', '文本'], ['seg', '分段'], ['raw', '原始']].map(([k, l]) => `<button class="${tf.tab === k ? 'on' : ''}" onclick="state.tf.tab='${k}';render()">${l}</button>`).join('')}</div>
               <span style="margin-left:auto;display:flex;gap:2px"><button class="btn" onclick="toast('已复制全文')">${icon('copy')}复制</button><button class="btn" onclick="toast('导出 .txt / .srt')">${icon('download')}导出</button><button class="btn" onclick="state.tf.phase='empty';render()">新文件</button></span>`}
        </div>
        <div class="detail-body scroll"><div class="inner">${tf.phase === 'running' ? '<p class="doc" style="color:var(--text-4)">正在识别，长文件会在后台继续…</p>'
          : tf.tab === 'seg' ? TF_SEGMENTS.map(([t, s]) => `<p style="margin:0 0 14px;display:grid;grid-template-columns:84px 1fr;gap:10px"><span class="mono cap muted" style="padding-top:3px">${t}</span><span style="font-size:15px;line-height:1.75">${s}</span></p>`).join('')
          : `<p class="doc" style="${tf.tab === 'raw' ? 'color:var(--text-3);font-size:15px' : ''}">${tf.tab === 'raw' ? TF_RAW : TF_SEGMENTS.map((s) => s[1]).join('')}</p>`}</div></div>`
    return `<div class="split">${opts}<div class="detail">${body}</div></div>`
  }
}

// =====================================================================
// 变体 C：专注单列 —— 顶部文字导航 + 居中单列
// =====================================================================
const C = {
  shell(content) {
    return `<div class="win vC">
      <div class="titlebar">
        <div class="lights"><i></i><i></i><i></i></div>
        <nav class="topnav">${PAGES.map((p) => `<button class="${state.page === p.key ? 'on' : ''}" onclick="go('${p.key}')">${p.label}</button>`).join('')}</nav>
        <div class="topright"><span class="dot ok" title="已连接"></span><button class="ibtn" title="设置（不在本次范围）" onclick="toast('设置页不在本次范围内')">${icon('gear')}</button></div>
      </div>
      <main class="main scroll"><div class="col">${content}</div></main>
    </div>`
  },
  timeline(list, { openable = true } = {}) {
    return groupByDay(list).map((g) => `<div class="tl-day">${g.label}</div>${g.items.map((r) => {
      const open = state.openRecord === r.id
      return `<div class="tl-item ${open ? 'open' : ''}" onclick="state.openRecord=${open ? 'null' : r.id};render()">
        <span class="time mono">${hm(r.at)}</span>
        <div><div class="text ${open ? '' : 'clamp3'}">${open ? br(r.opt) : esc(r.opt)}</div>
          ${open ? `<div class="raw">${esc(r.raw)}</div><div style="margin-top:10px;display:flex;gap:16px"><span class="meta mono">${dur(r.dur)} · 处理 ${r.proc}s</span><span class="meta"><span class="dot ok"></span>已优化</span></div>` : ''}</div>
        ${recActions(r)}
      </div>`
    }).join('')}`).join('')
  },
  home() {
    const busy = state.rec.phase !== 'idle'
    return `<div class="hero">
        <button class="rec-btn ${state.rec.phase}" onclick="toggleRec()">${icon(state.rec.phase === 'recording' ? 'stop' : 'mic')}</button>
        <span class="timer mono" data-timer>${timerText()}</span>
        <div class="hero-meta">${recStatus()}${busy ? '' : engineMeta}</div>
      </div>
      <div class="live ${busy ? '' : 'idle'}" ${busy ? 'data-live' : ''}>${busy ? liveHtml() : '说的话会实时出现在这里'}${busy ? '' : ''}</div>
      ${busy ? '<div style="position:relative;height:2px;margin-top:8px"><div class="flow"></div></div>' : ''}
      <div class="timeline">${this.timeline(records.slice(0, 6))}
        <div style="text-align:center;margin-top:20px"><button class="btn gold" onclick="go('records')">查看全部 ${records.length} 条</button></div></div>`
  },
  records() {
    const list = filteredRecords()
    return `<h1>记录集</h1><p class="sub">${records.length} 条录音 · 点开一条查看原始转写</p>
      <label class="search bigsearch">${icon('search')}<input placeholder="搜索你说过的话" value="${esc(state.query)}" oninput="state.query=this.value;renderKeepFocus(this)"><span class="kbd">⌘F</span></label>
      <div class="filters">${[['all', '全部'], ['fav', '收藏']].map(([k, l]) => `<button class="${(k === 'fav') === state.favOnly ? 'on' : ''}" onclick="state.favOnly=${k === 'fav'};render()">${l}</button>`).join('<span class="muted">·</span>')}</div>
      <div style="margin-top:12px">${list.length ? this.timeline(list) : '<div class="empty">没有匹配的记录</div>'}</div>`
  },
  clipboard() {
    const list = filteredClips()
    const images = list.filter((c) => c.type === 'image')
    const others = list.filter((c) => c.type !== 'image')
    return `<h1>剪贴板</h1><p class="sub"><span class="meta"><span class="dot ok"></span>监听中 · 今天 ${clips.filter((c) => dayLabel(c.at) === '今天').length} 条</span></p>
      <label class="search bigsearch">${icon('search')}<input placeholder="搜索复制过的内容" value="${esc(state.query)}" oninput="state.query=this.value;renderKeepFocus(this)"></label>
      <div class="filters">${CLIP_FILTERS.map((f) => `<button class="${state.clipFilter === f.key ? 'on' : ''}" onclick="state.clipFilter='${f.key}';render()">${f.label}</button>`).join('<span class="muted">·</span>')}</div>
      ${images.length ? `<div class="tl-day">图片</div><div class="clip-strip">${images.map((c) => `<div class="item" style="position:relative;flex:none"><div class="thumb" style="--g:${c.g};width:180px;height:112px"></div><div class="meta" style="margin-top:6px">${c.size} · ${rel(c.at)}</div><div class="hover-actions" style="position:absolute;top:6px;right:6px;background:rgba(10,10,11,.7);border-radius:8px">${clipActions(c).replace('class="hover-actions"', 'style="display:flex"')}</div></div>`).join('')}</div>` : ''}
      ${others.length ? `<div class="tl-day">文本与链接</div>${others.map((c) => `<div class="tl-item" style="cursor:default">
        <span class="time">${c.pin ? '<span style="color:var(--accent)">置顶</span>' : rel(c.at).replace(' 分钟前', ' 分').replace(' 小时前', ' 时')}</span>
        <div><div class="text clamp3 ${c.type !== 'long' ? 'mono' : ''}" style="${c.type !== 'long' ? 'font-size:13.5px;' : ''}${c.type === 'link' ? 'color:var(--accent)' : ''}">${esc(c.text)}</div></div>
        ${clipActions(c)}</div>`).join('')}` : ''}
      ${!list.length ? '<div class="empty">这个分类下还没有内容</div>' : ''}`
  },
  transcribe() {
    const tf = state.tf
    const sentence = `<p class="sentence">用 <span class="select inline">${tf.engine} ▾</span> 识别 <span class="select inline">${tf.lang} ▾</span>，
      <button class="chk" onclick="state.tf.seg=!state.tf.seg;render()"><span class="box ${tf.seg ? 'on' : ''}"></span>带时间戳</button>，
      <button class="chk" onclick="state.tf.proof=!state.tf.proof;render()"><span class="box ${tf.proof ? 'on' : ''}"></span>LLM 校对</button></p>`
    if (tf.phase === 'done') {
      return `<h1>转文字</h1><p class="sub mono">weekly-review-1030.mp4 · 24:16 · 用时 41s</p>
        <div class="filters">${[['text', '文本'], ['seg', '分段'], ['raw', '原始']].map(([k, l]) => `<button class="${tf.tab === k ? 'on' : ''}" onclick="state.tf.tab='${k}';render()">${l}</button>`).join('<span class="muted">·</span>')}
          <span class="muted" style="margin:0 8px">|</span><button onclick="toast('已复制全文')">复制</button><button onclick="toast('导出 .txt / .srt')">导出</button><button onclick="state.tf.phase='empty';render()">新文件</button></div>
        <div class="doc">${tf.tab === 'seg' ? TF_SEGMENTS.map(([t, s]) => `<p style="margin:0 0 12px"><span class="ts mono">${t}</span>${s}</p>`).join('') : tf.tab === 'raw' ? `<span style="color:var(--text-3)">${TF_RAW}</span>` : TF_SEGMENTS.map((s) => s[1]).join('')}</div>`
    }
    return `<h1>转文字</h1><p class="sub">本地音视频转成文本，结果不进记录集</p>
      <div class="drop" onclick="${tf.phase === 'running' ? '' : 'startTf()'}">
        <span style="color:var(--accent)">${icon(tf.phase === 'empty' ? 'upload' : 'file')}</span>
        ${tf.phase === 'empty' ? '<div style="font-size:16px">拖入音视频文件，或点击选择</div><div class="muted cap">mp4 / mov / wav / mp3 / m4a / flac · ⌘V 粘贴路径</div>'
          : `<div class="mono" style="font-size:15px">weekly-review-1030.mp4</div><div class="muted cap mono">24:16 · 186 MB</div>
             ${tf.phase === 'running' ? '<span class="meta"><span class="dot gold pulse"></span>转写中 38%</span><div class="flow"></div>' : '<button class="btn gold line" style="margin-top:4px" onclick="event.stopPropagation();startTf()">开始转写</button>'}`}
      </div>${sentence}`
  }
}

// ================= 渲染与切换条 =================
const V = { A, B, C }
function render() {
  const v = V[state.variant]
  document.getElementById('app').innerHTML = v.shell(v[state.page]())
  const url = new URL(location.href)
  url.searchParams.set('variant', state.variant); url.searchParams.set('page', state.page)
  history.replaceState(null, '', url)
  renderBar()
}
// 搜索框输入时重渲染但保住焦点与光标
function renderKeepFocus(input) {
  const ph = input.placeholder, pos = input.selectionStart
  render()
  const next = [...document.querySelectorAll('input')].find((el) => el.placeholder === ph)
  if (next) { next.focus(); next.setSelectionRange(pos, pos) }
}
function stepVariant(d) {
  const i = VARIANTS.findIndex((v) => v.key === state.variant)
  state.variant = VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length].key
  state.openRecord = null
  render()
}
function renderBar() {
  const v = VARIANTS.find((x) => x.key === state.variant)
  document.getElementById('proto-bar').innerHTML = `
    <button onclick="stepVariant(-1)" title="上一个变体（←）">‹</button>
    <span class="lbl">${v.key} · ${v.name}<small>原型 · ← → 切换</small></span>
    <button onclick="stepVariant(1)" title="下一个变体（→）">›</button>`
}
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, [contenteditable]')) return
  if (e.key === 'ArrowLeft') stepVariant(-1)
  if (e.key === 'ArrowRight') stepVariant(1)
})
render()
</script>
</body>
</html>
