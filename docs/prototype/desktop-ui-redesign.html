<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATT 桌面端 UI 重构 · 原型 v2</title>
<!--
  【原型 · 用完即弃】桌面端主窗口 UI 重构 v2
  v1 三个变体中选定 A「设置同构」（v1 留档：desktop-ui-redesign.v1-三变体.html）。
  v2 的改动：所有图标换成「文字图标」，与悬浮窗印章同一套语言——
    - 宋体粗体繁体字（Songti TC 等），录音按钮就是一枚印章：錄 待命 → 聽 录音中 → 轉 处理中 → 成 完成（敗 失败）
    - 印章底色沿用悬浮窗：錄 金 / 聽 朱红 / 轉 靛蓝 / 成 青绿 / 敗 暗红；换字时有「盖章」动效
    - 侧边栏：錄 首页 · 文 转文字 · 集 记录集 · 貼 剪贴板 · 設 设置；选中项是一枚金色小印章
    - 操作按钮：播 播放 · 複 复制 · 藏 收藏 · 頂 置顶 · 刪 删除 · 潤 重新优化 · 改 编辑 · 出 导出（悬停才出现，有 title 提示）
    - 剪贴板类型：文 文本 · 長 长文本 · 圖 图片 · 鏈 链接 · 檔 文件；搜索框前缀 尋
  页面用 ?page=home|transcribe|records|clipboard 切换（底部条或键盘 ← →）。全部是假数据，不连后端。
-->
<style>
:root {
  color-scheme: dark;
  /* —— 以下令牌与 src/styles/tokens.css 同值 —— */
  --gray-950: #0a0a0b; --gray-900: #111113; --gray-850: #18181b; --gray-800: #1f1f23;
  --gray-700: #2d2d32; --gray-600: #3f3f46; --gray-300: #a1a1aa;
  --bg-base: var(--gray-950); --bg-surface: var(--gray-900); --bg-card: var(--gray-850);
  --bg-raise: var(--gray-800); --bg-hover: var(--gray-700);
  --line: var(--gray-800); --line-strong: var(--gray-700); --line-soft: rgba(255,255,255,.06);
  --text-1: #f4f4f5; --text-2: #9d9da6; --text-3: #8b8b96; --text-4: #5f5f69;
  --accent: #c9a227; --accent-hi: #dcb63a;
  --accent-veil: rgba(201,162,39,.06); --accent-faint: rgba(201,162,39,.10); --accent-dim: rgba(201,162,39,.15);
  --accent-line: rgba(201,162,39,.30); --accent-line-strong: rgba(201,162,39,.42);
  --ok: #4ade80; --warn: #f5a524; --err: #f87171;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-6: 24px; --s-8: 32px;
  --r-sm: 6px; --r-md: 10px; --r-lg: 16px; --r-xl: 24px; --r-full: 9999px;
  --fs-cap: 12px; --fs-sm: 13px; --fs-base: 14px; --fs-md: 15px; --fs-lg: 18px; --fs-xl: 24px;
  --t-fast: 150ms; --t-base: 250ms; --ease: cubic-bezier(.4,0,.2,1); --grow: cubic-bezier(.2,.9,.3,1.2);
  --edge-hi: inset 0 1px 0 rgba(255,255,255,.04);
  --font-sans: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'SF Mono', Menlo, Consolas, 'Cascadia Mono', monospace;
  /* —— 与悬浮窗印章同一套字体（src/styles/floating.css .seal） —— */
  --font-seal: 'Songti TC', 'STSongti-TC-Black', 'Noto Serif TC', 'PMingLiU', 'MingLiU', serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg-base); color: var(--text-1); font: 14px/1.6 var(--font-sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb { background: rgba(161,161,170,.22); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: rgba(201,162,39,.6); }

/* ================= 文字图标（印章语言） ================= */
.g { font-family: var(--font-seal); font-weight: 900; line-height: 1; }
/* 印章：悬浮窗同款——方形、小圆角、内描边 + 底部压痕 */
.seal {
  --seal-bg: #c9a227; --seal-fg: #3a2a05;
  position: relative; display: inline-grid; place-items: center; flex: none;
  border-radius: 5px; background: var(--seal-bg); color: var(--seal-fg);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), inset 0 -2px 0 rgba(0,0,0,.18);
  font-family: var(--font-seal); font-weight: 900; line-height: 1;
  transition: background-color 280ms ease, color 280ms ease;
}
.seal[data-s='listening'] { --seal-bg: #c8463b; --seal-fg: #fbe7c6; }
.seal[data-s='converting'] { --seal-bg: #4257d3; --seal-fg: #f3d27a; }
.seal[data-s='success'] { --seal-bg: #2e9e6b; --seal-fg: #eafbf1; }
.seal[data-s='failure'] { --seal-bg: #6b2a26; --seal-fg: #f6c9bf; }
/* 换字时「盖章」：新字从稍大、略糊落下 */
.seal .ink { display: block; padding-bottom: .06em; animation: stamp 280ms var(--grow); }
@keyframes stamp { from { opacity: 0; transform: scale(1.4); filter: blur(2px); } }
/* 素印：次要位置用的无彩底文字图标 */
.tile { display: inline-grid; place-items: center; flex: none; border-radius: var(--r-sm); background: var(--bg-raise); color: var(--text-2); font-family: var(--font-seal); font-weight: 900; line-height: 1; }

/* ================= 共用原子 ================= */
.win { position: fixed; inset: 0; display: flex; flex-direction: column; }
.titlebar { height: 34px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
.titlebar i { width: 11px; height: 11px; border-radius: 50%; background: var(--gray-700); }
.body { flex: 1; min-height: 0; display: flex; }
.scroll { overflow-y: auto; min-height: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--text-3); }
.cap { font-size: var(--fs-cap); }

.meta { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-cap); color: var(--text-3); white-space: nowrap; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dot, var(--text-3)); flex: none; }
.dot.ok { --dot: var(--ok); } .dot.gold { --dot: var(--accent); } .dot.red { --dot: #c8463b; } .dot.blue { --dot: #6b7ff0; }
.dot.pulse { animation: pulse 1.4s var(--ease) infinite; }
@keyframes pulse { 50% { opacity: .3; } }

.label { display: flex; align-items: center; gap: 8px; margin: 0 0 var(--s-3); font-size: var(--fs-cap); font-weight: 600; letter-spacing: .15em; color: var(--text-2); }
.label::before { content: ''; width: 14px; height: 1px; background: linear-gradient(90deg, var(--accent), transparent); }
.label .aside { margin-left: auto; letter-spacing: 0; font-weight: 400; color: var(--text-3); }

/* 文字按钮：字印 + 文案（如「複 复制」） */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: var(--r-sm); color: var(--text-2); font-size: var(--fs-sm); white-space: nowrap; transition: background var(--t-fast), color var(--t-fast); }
.btn .g { font-size: 13px; color: var(--text-3); transition: color var(--t-fast); }
.btn:hover { background: var(--bg-raise); color: var(--text-1); }
.btn:hover .g { color: var(--accent); }
.btn.gold, .btn.gold .g { color: var(--accent); }
.btn.gold:hover { background: var(--accent-faint); }
.btn.line { border: 1px solid var(--line-strong); }
/* 单字按钮（悬停操作）：只有一个字，title 给出全称 */
.gbtn { width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: var(--r-sm); color: var(--text-3); font-family: var(--font-seal); font-weight: 900; font-size: 14px; line-height: 1; transition: background var(--t-fast), color var(--t-fast); }
.gbtn:hover { background: var(--bg-raise); color: var(--text-1); }
.gbtn.on { color: var(--accent); }
.gbtn.danger:hover { color: var(--err); background: rgba(248,113,113,.08); }

.flow { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--accent-faint); overflow: hidden; pointer-events: none; }
.flow::after { content: ''; position: absolute; top: 0; bottom: 0; width: 38%; background: linear-gradient(90deg, transparent, var(--flow, var(--accent)), transparent); animation: sweep 1.5s var(--ease) infinite; }
@keyframes sweep { from { left: -38%; } to { left: 100%; } }

.tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line); }
.tabs button { position: relative; padding: 8px 0 10px; font-size: var(--fs-sm); color: var(--text-3); }
.tabs button:hover, .tabs button.on { color: var(--text-1); }
.tabs button.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px; }

.search { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-md); }
.search:focus-within { border-color: var(--accent-line); }
.search .g { font-size: 14px; color: var(--text-4); }
.search:focus-within .g { color: var(--accent); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font-size: var(--fs-sm); color: var(--text-1); }
.search input::placeholder { color: var(--text-4); }
.kbd { font: 11px var(--font-mono); color: var(--text-4); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; }

.toggle { position: relative; width: 40px; height: 24px; flex: none; border-radius: var(--r-full); background: var(--gray-700); border: 1px solid var(--line-soft); transition: background var(--t-base); }
.toggle::before { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--gray-300); transition: transform var(--t-base), background var(--t-base); }
.toggle.on { background: var(--accent); }
.toggle.on::before { transform: translateX(16px); background: #fff; }
.select { display: inline-flex; align-items: center; justify-content: space-between; gap: 10px; height: 34px; min-width: 160px; padding: 0 12px; background: var(--bg-raise); border: 1px solid var(--line-strong); border-radius: var(--r-md); color: var(--text-1); font-size: var(--fs-sm); }
.select::after { content: ''; width: 6px; height: 6px; border-right: 1.5px solid var(--text-3); border-bottom: 1.5px solid var(--text-3); transform: translateY(-2px) rotate(45deg); }

.row { position: relative; display: flex; align-items: center; gap: var(--s-4); padding: var(--s-3) var(--s-4); background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-md); transition: border-color var(--t-fast); }
.row + .row { margin-top: var(--s-2); }
.row .grow { flex: 1; min-width: 0; }
.row .title { font-size: var(--fs-base); font-weight: 500; }
.row .desc { font-size: var(--fs-cap); color: var(--text-3); }
.hover-actions { display: flex; gap: 2px; opacity: 0; transition: opacity var(--t-fast); }
.row:hover .hover-actions { opacity: 1; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.wave { display: flex; align-items: center; gap: 3px; height: 28px; align-self: center; }
.wave i { width: 2px; height: 3px; border-radius: 2px; background: var(--gray-600); }
.wave.live i { background: #c8463b; animation: wv 1s ease-in-out infinite; }
.wave.live i:nth-child(3n) { animation-delay: -.3s; } .wave.live i:nth-child(3n+1) { animation-delay: -.6s; } .wave.live i:nth-child(4n) { animation-duration: .8s; }
@keyframes wv { 0%,100% { height: 4px; } 50% { height: 24px; } }
.live-cursor::after { content: ''; display: inline-block; width: 2px; height: 1em; margin-left: 2px; vertical-align: -2px; background: var(--accent); animation: pulse 1s steps(1) infinite; }

.thumb { border-radius: var(--r-sm); background: var(--g); border: 1px solid var(--line); flex: none; }
.empty { display: grid; place-items: center; gap: 10px; padding: 48px 0; color: var(--text-3); font-size: var(--fs-sm); }
.toast { position: fixed; left: 50%; bottom: 72px; transform: translate(-50%, 8px); opacity: 0; display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--bg-raise); border: 1px solid var(--line-strong); border-radius: var(--r-full); font-size: var(--fs-sm); transition: opacity var(--t-base), transform var(--t-base); pointer-events: none; z-index: 50; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.proto-bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 100; display: flex; align-items: center; gap: 4px; padding: 4px; background: #f4f4f5; color: #111; border-radius: 999px; box-shadow: 0 8px 30px rgba(0,0,0,.6); font: 12px/1 system-ui, sans-serif; }
.proto-bar button { height: 28px; min-width: 28px; padding: 0 10px; border-radius: 999px; color: #111; font-weight: 600; }
.proto-bar button:hover { background: #e4e4e7; }
.proto-bar .lbl { padding: 0 8px; font-weight: 600; white-space: nowrap; }
.proto-bar .lbl small { font-weight: 400; color: #52525b; margin-left: 6px; }

/* ================= 外壳：设置同构 ================= */
.side { width: 208px; flex: none; display: flex; flex-direction: column; padding: 6px 12px 14px; border-right: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 18px; font-weight: 600; letter-spacing: .02em; }
.brand .seal { width: 24px; height: 24px; font-size: 15px; }
.nav button { width: 100%; display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 8px; border-radius: var(--r-md); color: var(--text-2); font-size: var(--fs-base); }
.nav button + button { margin-top: 2px; }
.nav button:hover { background: var(--bg-card); color: var(--text-1); }
.nav .ng { width: 22px; height: 22px; display: inline-grid; place-items: center; flex: none; border-radius: 5px; font-family: var(--font-seal); font-weight: 900; font-size: 14px; line-height: 1; color: var(--text-3); transition: background var(--t-fast), color var(--t-fast); }
.nav button:hover .ng { color: var(--text-1); }
.nav button.on { background: var(--accent-dim); color: var(--accent); }
.nav button.on .ng { background: #c9a227; color: #3a2a05; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), inset 0 -2px 0 rgba(0,0,0,.18); }
.nav hr { border: 0; border-top: 1px solid var(--line); margin: 10px 4px; }
.side-foot { margin-top: auto; padding: 0 8px; display: grid; gap: 6px; }
.main { flex: 1; min-width: 0; }
.page { max-width: 960px; margin: 0 auto; padding: 18px 40px 96px; }
.crumb { font-size: var(--fs-cap); color: var(--text-3); }
h1 { margin: 2px 0 4px; font-size: var(--fs-xl); font-weight: 600; letter-spacing: .01em; }
.lead { margin: 0 0 var(--s-6); font-size: var(--fs-sm); color: var(--text-2); }
.section { position: relative; background: var(--bg-surface); border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--edge-hi); overflow: hidden; }
.section + .section { margin-top: var(--s-4); }
.group { padding: var(--s-6); }

/* 录音：一枚大印章 */
.recorder { display: flex; align-items: center; gap: var(--s-6); }
.rec-seal { width: 64px; height: 64px; border-radius: 8px; font-size: 36px; transition: transform var(--t-fast), background-color 280ms ease, color 280ms ease, box-shadow var(--t-base); }
.rec-seal:hover { transform: translateY(-1px); }
.rec-seal:active { transform: scale(.96); }
.rec-seal[data-s='idle'] { box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), inset 0 -3px 0 rgba(0,0,0,.18), 0 0 0 6px var(--accent-faint); }
.rec-seal[data-s='listening']::after { content: ''; position: absolute; inset: -6px; border-radius: 12px; border: 1px solid rgba(200,70,59,.55); animation: ring 1.6s var(--ease) infinite; }
@keyframes ring { from { transform: scale(.94); opacity: 1; } to { transform: scale(1.22); opacity: 0; } }
.recorder .timer { font-size: 28px; line-height: 1; letter-spacing: .04em; }
.recorder .readout { display: grid; gap: 8px; min-width: 150px; }
.recorder .side-meta { margin-left: auto; display: grid; justify-items: end; gap: 6px; }
.live { margin-top: var(--s-4); padding: var(--s-4); min-height: 64px; background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r-md); font-size: var(--fs-md); line-height: 1.75; }
.live.converting { color: var(--text-3); }

.rec-row { cursor: pointer; align-items: flex-start; }
.rec-row:hover { border-color: var(--line-strong); }
.rec-row.open { border-color: var(--accent-line); }
.rec-row .time { width: 46px; flex: none; padding-top: 2px; font-size: var(--fs-cap); color: var(--text-3); }
.rec-row .text { font-size: var(--fs-base); line-height: 1.65; }
.rec-row .meta-col { display: flex; align-items: center; gap: 10px; flex: none; }
.rec-row .meta-col > .mono { width: 34px; text-align: right; }
.rec-row .hover-actions { margin-top: -4px; }
.rec-detail { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-4); margin-top: var(--s-3); }
.rec-detail h4 { margin: 0 0 4px; font-size: var(--fs-cap); font-weight: 500; color: var(--text-3); }
.rec-detail p { margin: 0; font-size: var(--fs-sm); line-height: 1.7; color: var(--text-2); }
.day { margin: var(--s-6) 0 var(--s-2); font-size: var(--fs-cap); color: var(--text-3); }
.day:first-child { margin-top: 0; }
.toolbar { display: flex; align-items: center; gap: var(--s-3); margin-bottom: var(--s-4); }
.toolbar .search { flex: 1; }
.drop { position: relative; display: flex; align-items: center; gap: var(--s-4); padding: var(--s-6); border: 1px dashed var(--line-strong); border-radius: var(--r-md); background: var(--bg-card); cursor: pointer; transition: border-color var(--t-fast); }
.drop:hover { border-color: var(--accent-line-strong); }
.clip-row .text { font-size: var(--fs-sm); }
/* 图片行：列表里与其他类型一样只放「圖」字印，悬停字印或整行时浮出缩略图 */
.peek { position: relative; display: inline-flex; flex: none; }
.peek-card { position: absolute; left: 0; bottom: calc(100% + 8px); z-index: 20; display: grid; gap: 6px; width: 220px; padding: 8px; background: var(--bg-raise); border: 1px solid var(--line-strong); border-radius: var(--r-md); box-shadow: 0 18px 44px rgba(0,0,0,.5); opacity: 0; transform: translateY(4px); pointer-events: none; transition: opacity var(--t-fast), transform var(--t-fast); }
.peek-card .thumb { width: 100%; max-height: 260px; }
.clip-row:hover .peek-card { opacity: 1; transform: none; }
.clip-row:hover .peek .tile { color: var(--accent); }
.result { font-size: var(--fs-md); line-height: 1.85; }
.seg-list { display: grid; gap: 10px; }
.seg-list div { display: grid; grid-template-columns: 92px 1fr; gap: 12px; font-size: var(--fs-sm); }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"><span class="dot ok"></span><span id="toast-text"></span></div>
<div class="proto-bar" id="proto-bar"></div>

<script>
// ================= 文字图标表（全应用唯一来源） =================
const G = {
  brand: '聲',
  // 印章四态：与悬浮窗 floatingView.mjs 的 GLYPHS 一致
  idle: '錄', listening: '聽', converting: '轉', success: '成', failure: '敗',
  // 导航
  home: '錄', transcribe: '文', records: '集', clipboard: '貼', settings: '設',
  // 操作
  play: '播', copy: '複', fav: '藏', more: '⋯', pin: '頂', del: '刪', reopt: '潤', edit: '改', export: '出', search: '尋', import: '入', file: '檔',
  // 剪贴板类型
  text: '文', long: '長', image: '圖', link: '鏈'
}
const SEAL_LABEL = { idle: '待命', listening: '录音中', converting: '处理中', success: '已完成', failure: '失败' }

// ================= 假数据 =================
const now = new Date(2026, 9, 31, 9, 40)
const ago = (min) => new Date(now.getTime() - min * 60000)
let records = [

const pad = (n) => String(n).padStart(2, '0')
const hm = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`
const dur = (s) => `${Math.floor(s / 60)}:${pad(Math.round(s % 60))}`
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const br = (s) => esc(s).replace(/\n/g, '<br>')
function dayLabel(d) {
  const diff = Math.round((new Date(now.toDateString()) - new Date(d.toDateString())) / 86400000)
  return diff === 0 ? '今天' : diff === 1 ? '昨天' : `${d.getMonth() + 1} 月 ${d.getDate()} 日`
}
function rel(d) {
  const m = Math.round((now - d) / 60000)
  return m < 60 ? `${m} 分钟前` : m < 1440 ? `${Math.round(m / 60)} 小时前` : dayLabel(d)
}
function groupByDay(list) {
  const groups = []
  for (const item of list) {
    const label = dayLabel(item.at)
    const last = groups[groups.length - 1]
    if (last && last.label === label) last.items.push(item)
    else groups.push({ label, items: [item] })
  }
  return groups
}

  const s = Math.floor(((state.rec.stoppedAt || Date.now()) - state.rec.startedAt) / 1000)
  return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`
}
function recStatus() {
  const s = state.rec.seal
  if (s === 'listening') return '<span class="meta"><span class="dot red pulse"></span>录音中 · 再按一次结束</span>'
  if (s === 'converting') return '<span class="meta"><span class="dot blue pulse"></span>转写与优化中…</span>'
  if (s === 'success') return '<span class="meta"><span class="dot ok"></span>已复制到剪贴板</span>'
  return '<span class="meta"><span class="dot gold"></span>待命 · 按住 ⌥⌘ 说话</span>'
}

// ================= 交互 =================
function go(page) { state.page = page; state.query = ''; state.openRecord = null; render() }
function toggleRec() {
  const r = state.rec
  if (r.seal === 'idle' || r.seal === 'success') {
    Object.assign(r, { seal: 'listening', startedAt: Date.now(), stoppedAt: 0, live: '' })
    let i = 0
    clearInterval(liveTimer)
    liveTimer = setInterval(() => {
      if (i < LIVE_SCRIPT.length) r.live = LIVE_SCRIPT.slice(0, ++i)
      document.querySelectorAll('[data-live]').forEach((el) => { el.innerHTML = liveHtml() })
      document.querySelectorAll('[data-timer]').forEach((el) => { el.textContent = timerText() })
    }, 110)
  } else if (r.seal === 'listening') {
    clearInterval(liveTimer)
    r.seal = 'converting'; r.stoppedAt = Date.now()
    setTimeout(() => {
      const id = Date.now()
      records.unshift({ id, at: new Date(now.getTime() + 60000), dur: Math.max(3, Math.floor((r.stoppedAt - r.startedAt) / 1000)), proc: 1.4, fav: false, raw: r.live || LIVE_SCRIPT, opt: r.live || LIVE_SCRIPT })
      r.seal = 'success'; render(); toast('已转写，并复制到剪贴板')
      setTimeout(() => { if (r.seal === 'success') { r.seal = 'idle'; r.live = ''; render() } }, 1400)
    }, 1600)
  }
  render()
}
function toast(text) {
  const el = document.getElementById('toast')
  document.getElementById('toast-text').textContent = text
  el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 1600)
}

          ${c.type === 'image'
            ? `<span class="peek">${tile(G.image, 32, c.pin ? 'color:var(--accent)' : '')}<span class="peek-card"><span class="thumb" style="--g:${c.g};aspect-ratio:${c.size.replace(' × ', '/')}"></span><span class="meta mono">${c.size}</span></span></span>`
            : tile(G[c.type === 'file' ? 'file' : c.type], 32, c.pin ? 'color:var(--accent)' : '')}
          <div class="grow"><div class="text clamp2 ${c.type !== 'long' ? 'mono' : ''}" style="${c.type === 'link' ? 'color:var(--accent)' : ''}">${esc(c.text)}</div>
            <div class="desc">${clipType(c.type)}${c.size ? ' · ' + c.size : ''} · ${rel(c.at)}${c.pin ? ' · 已置顶' : ''}</div></div>
          ${clipActions(c)}
        </div>`).join('') : `<div class="empty">${tile(G.clipboard, 40)}这个分类下还没有内容</div>`}
      </div></section>`
  }
}

// ================= 渲染与翻页条 =================
function render() {
  document.getElementById('app').innerHTML = shell(pages[state.page]())
  const url = new URL(location.href)
  url.searchParams.set('page', state.page); url.searchParams.delete('variant')
  history.replaceState(null, '', url)
  const i = PAGES.findIndex((p) => p.key === state.page)
  document.getElementById('proto-bar').innerHTML = `
    <button onclick="stepPage(-1)" title="上一页（←）">‹</button>
    <span class="lbl">v2 · ${PAGES[i].label}<small>A 设置同构 + 文字图标 · ← → 翻页</small></span>
    <button onclick="stepPage(1)" title="下一页（→）">›</button>`
}
function stepPage(d) { const i = PAGES.findIndex((p) => p.key === state.page); go(PAGES[(i + d + PAGES.length) % PAGES.length].key) }
function renderKeepFocus(input) {
  const ph = input.placeholder, pos = input.selectionStart
  render()
  const next = [...document.querySelectorAll('input')].find((el) => el.placeholder === ph)
  if (next) { next.focus(); next.setSelectionRange(pos, pos) }
}
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, [contenteditable]')) return
  if (e.key === 'ArrowLeft') stepPage(-1)
  if (e.key === 'ArrowRight') stepPage(1)
})
render()
</script>
</body>
</html>
