# =============================================================================
# 实时 ASR 双容器编排
#
# 服务划分（对应需求 FR-13）：
#   asr     —— Qwen3-ASR 真流式桥接服务，独占 GPU，端口不发布到宿主
#   backend —— FastAPI 业务后端，不含 GPU，通过容器网络访问 asr
#
# 卷约定（对应需求 §7，D8 已定：沿用仓库内目录）：
#   ./data   -> /app/data    业务数据与加密密钥（必须持久化）
#   ./models -> /app/models  模型缓存，直接复用宿主已有模型
#   ./logs   -> /app/logs    应用日志与桥接服务日志
#   ./.env   -> /app/.env    配置（只读挂载，不进镜像）
# =============================================================================

name: att

x-runtime-image: &runtime-image
  image: att-runtime:local

# 构建配置只挂在 asr 服务上：
# 两个服务共用同一个镜像标签，若两边都声明 build，compose 会并发构建同一目标，
# 存在竞态（实测出现过一次 buildx 失败）。镜像构建一次，两个服务共用即可。
x-runtime-build: &runtime-build
  context: .
  dockerfile: docker/Dockerfile
  args:
    VLLM_IMAGE: ${VLLM_IMAGE:-vllm/vllm-openai:v0.14.0}

x-common-volumes: &common-volumes
  - ./data:/app/data
  - ./models:/app/models
  - ./logs:/app/logs
  - ./.env:/app/.env:ro

services:
  # ---------------------------------------------------------------- ASR 服务
  asr:
    <<: *runtime-image
    build: *runtime-build
    container_name: att-asr
    restart: unless-stopped
    command:
      # 由入口脚本启动：先拉起 uvicorn，再自动预热模型
      - sh
      - /app/scripts/docker/asr_entrypoint.sh
    environment:
      # 流式模型与缓存：直接使用宿主已下载的模型目录
      QWEN_STREAMING_MODEL: ${QWEN_STREAMING_MODEL:-Qwen/Qwen3-ASR-1.7B}
      QWEN_STREAMING_CACHE_DIR: /app/models/qwen
      # 分块与显存参数（对应决策点 D5）
      QWEN_STREAMING_CHUNK_SIZE_SEC: ${QWEN_STREAMING_CHUNK_SIZE_SEC:-2.0}
      QWEN_STREAMING_UNFIXED_CHUNK_NUM: ${QWEN_STREAMING_UNFIXED_CHUNK_NUM:-2}
      QWEN_STREAMING_UNFIXED_TOKEN_NUM: ${QWEN_STREAMING_UNFIXED_TOKEN_NUM:-5}
      QWEN_STREAMING_MAX_MODEL_LEN: ${QWEN_STREAMING_MAX_MODEL_LEN:-16384}
      QWEN_STREAMING_GPU_MEMORY_UTILIZATION: ${QWEN_STREAMING_GPU_MEMORY_UTILIZATION:-0.85}
      QWEN_STREAMING_MAX_NEW_TOKENS: ${QWEN_STREAMING_MAX_NEW_TOKENS:-256}
      # 模型已在本地，禁止运行时联网抓取
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # 预热时同时完成 vLLM 引擎预热，避免首次录音承受数十秒编译开销
      QWEN_STREAMING_WARMUP: ${QWEN_STREAMING_WARMUP:-1}
      # 容器启动后自动预热模型：保证「容器起来 = 流式可用」。
      # 否则容器被 Docker Desktop 自动重启后模型处于未加载态，
      # 前端会把它显示成「模型加载中」并禁用开启按钮，用户陷入死局。
      QWEN_STREAMING_AUTO_PRELOAD: ${QWEN_STREAMING_AUTO_PRELOAD:-1}
    volumes: *common-volumes
    # vLLM 需要较大的共享内存，默认 64MB 会导致启动即崩
    shm_size: 8gb
    # RTX 5090 需要 GPU 直通；无 GPU 时该服务会启动失败并给出明确报错
    gpus: all
    healthcheck:
      # 存活探测：只要 HTTP 能响应即视为健康，模型加载状态由 /api/health 的
      # ready/loaded 字段表达，由启动脚本负责等待就绪（FR-4.1）
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/api/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # ---------------------------------------------------------------- 业务后端
  backend:
    <<: *runtime-image
    container_name: att-backend
    restart: unless-stopped
    command:
      - python3
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    depends_on:
      asr:
        condition: service_healthy
    environment:
      PORT: "8000"
      DATA_DIR: /app/data
      MODELS_DIR: /app/models
      # 强制走 Qwen 真流式链路，并指向 ASR 容器（对应 FR-13.2）
      ASR_PROVIDER: ${DOCKER_ASR_PROVIDER:-qwen_asr}
      ASR_PRELOAD_ON_STARTUP: "false"
      QWEN_STREAMING_BACKEND: remote_bridge
      QWEN_STREAMING_BASE_URL: http://asr:9000
      # 单段/多段模式在后端容器内没有 GPU，禁止尝试本地加载大模型
      QWEN_ASR_DEVICE: cpu
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
    volumes: *common-volumes
    # 后端不需要 GPU：这同时是一道防线，即使配置写错也无法在业务容器里
    # 偷偷加载一份模型抢显存（对应约束 C14 的兜底）
    ports:
      - "127.0.0.1:${ATT_BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
