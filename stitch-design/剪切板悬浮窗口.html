<!DOCTYPE html>

<html class="dark" lang="zh-Hans"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "background": "#131313",
              "on-error": "#690005",
              "surface-tint": "#febb2b",
              "surface-dim": "#131313",
              "error": "#ffb4ab",
              "surface": "#131313",
              "surface-container-high": "#2a2a2a",
              "outline": "#99907c",
              "secondary-container": "#474747",
              "surface-container": "#201f1f",
              "on-secondary": "#303030",
              "primary-container": "#e8a70f",
              "error-container": "#93000a",
              "on-background": "#e5e2e1",
              "primary": "#ffc557",
              "surface-container-highest": "#353534",
              "inverse-surface": "#e5e2e1",
              "primary-fixed-dim": "#febb2b",
              "on-primary-container": "#5c4000",
              "surface-container-low": "#1c1b1b",
              "outline-variant": "#4d4635",
              "secondary": "#c8c6c5",
              "surface-bright": "#393939",
              "on-tertiary-container": "#5b4000",
              "on-tertiary": "#412d00",
              "tertiary": "#ffc551",
              "surface-variant": "#353534",
              "on-surface-variant": "#d0c5af",
              "surface-container-lowest": "#0e0e0e",
              "on-secondary-container": "#b6b5b4",
              "on-primary": "#422d00",
              "on-surface": "#e5e2e1"
            },
            fontFamily: {
              "headline": ["Manrope", "sans-serif"],
              "body": ["Inter", "sans-serif"],
              "label": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
      body {
        background-color: transparent;
        font-family: 'Inter', sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        display: inline-block;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-smoothing: antialiased;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #131313;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #4d4635;
        border-radius: 10px;
      }
      .glass-effect {
        backdrop-filter: blur(20px);
        background-color: rgba(28, 27, 27, 0.95);
      }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
<!-- Mini Overlay Container -->
<div class="w-[350px] glass-effect border border-outline-variant/20 rounded-xl overflow-hidden shadow-[0_12px_40px_rgba(0,0,0,0.6)] flex flex-col">
<!-- Header Section -->
<header class="bg-[#131313] px-4 py-3 flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-lg" data-icon="history">history</span>
<h1 class="font-headline font-bold text-on-surface text-base tracking-tight">最近记录</h1>
</div>
<div class="flex gap-2">
<button class="p-1.5 hover:bg-surface-container-high rounded-lg transition-colors text-on-surface-variant">
<span class="material-symbols-outlined text-sm" data-icon="push_pin">push_pin</span>
</button>
<button class="p-1.5 hover:bg-surface-container-high rounded-lg transition-colors text-on-surface-variant">
<span class="material-symbols-outlined text-sm" data-icon="close">close</span>
</button>
</div>
</header>
<!-- Search Bar Container -->
<div class="px-4 py-2 bg-surface-container-low">
<div class="relative group">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant text-sm group-focus-within:text-primary transition-colors" data-icon="search">search</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant/20 focus:border-primary/40 focus:ring-0 text-on-surface text-xs rounded-lg pl-9 pr-4 py-2 transition-all outline-none placeholder:text-on-surface-variant/50" placeholder="查找剪贴记录..." type="text"/>
</div>
</div>
<!-- Scrollable List -->
<main class="flex-grow max-h-[400px] overflow-y-auto custom-scrollbar bg-surface-container-low">
<!-- Item 1: Active/Recent Text -->
<div class="group relative px-4 py-3 hover:bg-surface-container-high transition-all cursor-pointer border-l-2 border-transparent hover:border-primary">
<div class="flex items-start gap-3">
<div class="mt-1 p-1.5 bg-primary/10 rounded flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-sm" data-icon="notes">notes</span>
</div>
<div class="flex-grow min-w-0">
<p class="text-on-surface text-sm font-medium truncate mb-0.5">关于 obsidian 设计系统的核心原则...</p>
<div class="flex items-center justify-between">
<span class="text-[10px] text-on-surface-variant font-label">2 分钟前</span>
<span class="text-[10px] text-primary/70 bg-primary/5 px-1.5 py-0.5 rounded border border-primary/10 opacity-0 group-hover:opacity-100 transition-opacity">已优化</span>
</div>
</div>
</div>
</div>
<!-- Item 2: Link -->
<div class="group relative px-4 py-3 hover:bg-surface-container-high transition-all cursor-pointer border-l-2 border-transparent hover:border-primary">
<div class="flex items-start gap-3">
<div class="mt-1 p-1.5 bg-surface-container-highest rounded flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-sm" data-icon="link">link</span>
</div>
<div class="flex-grow min-w-0">
<p class="text-on-surface text-sm font-medium truncate mb-0.5">https://github.com/obsidian-manager/...</p>
<div class="flex items-center justify-between">
<span class="text-[10px] text-on-surface-variant font-label">5 分钟前</span>
<span class="material-symbols-outlined text-on-surface-variant text-sm opacity-0 group-hover:opacity-100 transition-opacity" data-icon="content_copy">content_copy</span>
</div>
</div>
</div>
</div>
<!-- Item 3: Image Snippet -->
<div class="group relative px-4 py-3 hover:bg-surface-container-high transition-all cursor-pointer border-l-2 border-transparent hover:border-primary">
<div class="flex items-start gap-3">
<div class="mt-1 w-8 h-8 rounded bg-surface-container-highest overflow-hidden flex-shrink-0">
<img class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition-opacity" data-alt="abstract fluid shapes with deep obsidian blacks and glowing amber highlights minimalist digital art" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBtLA1Vm71mIW51sANGviQpyeob64NfZZPJmZRE4S4CMtHBqIMTl3H-tDikhQqThWQ8QiJ0aXk7p0B_I-jdZXkW0g1KXCTqBgwVu3IDWWC67d4F__uN7H6t-HO4GbyclXR3qgpFPEsOhc98ppsvGSWRQJytHApz2aGQfalLuqZM9LtT2EIXHWEzOyAh4lIZ8L3hJ2DTxgPrjey3axpDXQPjUBNLs3hBZVY6TH5vnapuwnpYCxMsFLVuA9YL0TLKEPyzvnFeooxi2-E"/>
</div>
<div class="flex-grow min-w-0">
<p class="text-on-surface text-sm font-medium truncate mb-0.5">屏幕截图 - 2023-10-24.png</p>
<div class="flex items-center justify-between">
<span class="text-[10px] text-on-surface-variant font-label">12 分钟前</span>
<span class="text-[10px] px-1.5 py-0.5 rounded bg-surface-container-highest text-on-surface-variant">图片</span>
</div>
</div>
</div>
</div>
<!-- Item 4: Code -->
<div class="group relative px-4 py-3 hover:bg-surface-container-high transition-all cursor-pointer border-l-2 border-transparent hover:border-primary">
<div class="flex items-start gap-3">
<div class="mt-1 p-1.5 bg-surface-container-highest rounded flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-sm" data-icon="code">code</span>
</div>
<div class="flex-grow min-w-0">
<p class="text-on-surface text-sm font-mono truncate mb-0.5">export const THEME = "OBSIDIAN";</p>
<div class="flex items-center justify-between">
<span class="text-[10px] text-on-surface-variant font-label">28 分钟前</span>
<span class="material-symbols-outlined text-on-surface-variant text-sm opacity-0 group-hover:opacity-100 transition-opacity" data-icon="more_horiz">more_horiz</span>
</div>
</div>
</div>
</div>
<!-- Item 5: Text -->
<div class="group relative px-4 py-3 hover:bg-surface-container-high transition-all cursor-pointer border-l-2 border-transparent hover:border-primary">
<div class="flex items-start gap-3">
<div class="mt-1 p-1.5 bg-surface-container-highest rounded flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-sm" data-icon="description">description</span>
</div>
<div class="flex-grow min-w-0">
<p class="text-on-surface text-sm font-medium truncate mb-0.5">产品发布会会议纪要核心要点整理...</p>
<div class="flex items-center justify-between">
<span class="text-[10px] text-on-surface-variant font-label">1 小时前</span>
</div>
</div>
</div>
</div>
</main>
<!-- Footer Section -->
<footer class="bg-[#1c1b1b] px-4 py-3 border-t border-outline-variant/10 flex items-center justify-between">
<button class="flex items-center gap-2 text-on-surface-variant hover:text-error transition-colors text-xs font-medium py-1 px-2 hover:bg-error/10 rounded">
<span class="material-symbols-outlined text-sm" data-icon="delete_sweep">delete_sweep</span>
                清除所有
            </button>
<div class="flex items-center gap-3">
<button class="p-1.5 hover:bg-surface-container-high rounded-lg transition-colors text-on-surface-variant">
<span class="material-symbols-outlined text-sm" data-icon="settings">settings</span>
</button>
<div class="h-4 w-[1px] bg-outline-variant/20"></div>
<div class="flex items-center gap-1.5">
<div class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></div>
<span class="text-[10px] text-on-surface-variant uppercase tracking-wider font-bold">Obsidian Live</span>
</div>
</div>
</footer>
</div>
</body></html>
