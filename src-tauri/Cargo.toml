# ATT 桌面应用：本文件同时是 workspace 根与 Tauri app 包（标准 Tauri 布局）
[workspace]
resolver = "2"
members = [
    "crates/att-audio",
    "crates/att-core",
    "crates/att-hotkey",
    "crates/att-server",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "macros", "rt", "rt-multi-thread", "fs", "net", "time"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

[package]
name = "att-app"
description = "ATT 桌面应用（Tauri 2 壳：装配核心 + 数据面服务 + 前端命令）"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "att-app"

[lib]
name = "att_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
att-audio = { path = "crates/att-audio" }
att-core = { path = "crates/att-core" }
att-hotkey = { path = "crates/att-hotkey" }
att-server = { path = "crates/att-server" }
# macos-private-api：悬浮窗透明背景（macOS 需要私有 API）
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
# 「转文字」页的系统选择文件对话框
tauri-plugin-dialog = "2"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 剪贴板（读写文本/图片）
arboard = "3"
uuid = { version = "1", features = ["v4"] }
chrono = { workspace = true }
# 剪贴板图片去重（PNG 字节 SHA-256，与旧版文件命名一致）
sha2 = "0.10"
# PNG 解码（写剪贴板图片）
image = { version = "0.25", default-features = false, features = ["png"] }

# 模拟粘贴（CGEvent）与辅助功能授权检测
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
# 设置页权限状态：查询 AVCaptureDevice 麦克风授权
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }
# 录音期间系统静音：Core Audio IAudioEndpointVolume（COM 接口只在 windows crate 里）
windows = { version = "0.62", features = [
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
