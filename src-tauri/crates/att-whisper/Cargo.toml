[package]
name = "att-whisper"
description = "本地 faster-whisper 引擎：CTranslate2（ct2rs）绑定的 Whisper 推理，复用 Python 版 model.bin"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tracing = { workspace = true }
# 读 CTranslate2 模型的 config.json（缺 preprocessor_config.json 时推断 mel 维度）
serde_json = { workspace = true }

# CTranslate2 的 Rust 绑定（build.rs 会用 CMake 静态编译 CTranslate2）。CPU 后端按平台区分：
#
# - Windows / Linux：dnnl(oneDNN) + OpenMP 是 CPU 上唯一实用的组合——只开默认的 ruy
#   （纯 float32、无并行）时，large-v3 在 CPU 上要跑约 9 倍音频时长，不可用。
# - macOS：Apple Clang 不支持 `-fopenmp`，ct2rs 的 openmp-runtime-comp 还会去链 GNU `gomp`，
#   这里改用 ct2rs 推荐的 Accelerate（Apple 的 BLAS，走 AMX）+ 默认 ruy（int8 GEMM）。
[target.'cfg(target_os = "macos")'.dependencies]
ct2rs = { version = "0.11.3", features = ["whisper", "accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
ct2rs = { version = "0.11.3", features = ["whisper", "dnnl", "openmp-runtime-comp"] }

[features]
default = []
# 便携 CUDA 推理：编译需要 CUDA Toolkit，运行期由 cuda-dynamic-loading 按需加载 cuBLAS。
# 不静态导入 CUDA 运行库，未装 CUDA 的机器仍能启动，加载模型失败后自动回退 CPU + int8。
cuda = ["ct2rs/cuda", "ct2rs/cuda-dynamic-loading"]
# 追加 cuDNN 卷积加速：编译与运行都需要 cuDNN 9（Windows 上链接 cudnn.lib / cudnn64_9.dll）。
# 打开后二进制启动时就会加载 cuDNN，没有安装 cuDNN 的机器无法启动，只给确定有 GPU + cuDNN 的构建用。
cuda-cudnn = ["cuda", "ct2rs/cudnn"]

[dev-dependencies]
# 集成测试读 WAV
hound = "3.5"
