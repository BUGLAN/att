[package]
name = "att-core"
description = "ATT 领域内核：存储/设置/记录/迁移/事件总线（不依赖桌面框架，可 headless 测试）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process"] }
chrono = { workspace = true }
tracing = { workspace = true }
# Fernet 兼容加密：纯 Rust 规范实现（不用 fernet crate——它拖 openssl，
# Windows 分发不友好），与 Python cryptography 互操作由 fixture 测试锁定
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
# WAV 读写与时长解析（迁移阶段的音频错位修复）
hound = "3.5"
# 录音落盘压成 FLAC（纯 Rust 编码，不开并行 / serde）；claxon 解码，供离线评测读回录音
flacenc = { version = "0.5", default-features = false }
claxon = "0.4"
# 探测旧 Electron userData 目录（迁移 legacy desktop-settings.json）
dirs = "6"
# 豆包 SAUC 流式 ASR：WebSocket（native-tls：mac/Win 走系统 TLS，不引入 OpenSSL/aws-lc 构建依赖）
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
# 剪贴板图片缩略图：悬浮框卡片只要几百像素宽，原图（常见 2K~4K 截图）解码太重
image = { version = "0.25", default-features = false, features = ["png"] }
# 数据备份 / 恢复：zip 打包（CTranslate2 的 ndarray-npy 已带同版本 zip，不会新增下载）
zip = { version = "2.6", default-features = false, features = ["deflate"] }
# 本地引擎：faster-whisper（CTranslate2/ct2rs）与 Qwen3-ASR（sherpa-onnx ONNX）
att-whisper = { path = "../att-whisper", optional = true }
att-qwen = { path = "../att-qwen", optional = true }
# LLM 网关：native-tls 与 WebSocket 同一套系统 TLS；system-proxy 读系统代理（与 Python httpx 走代理的行为对齐）
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "http2", "charset", "system-proxy", "multipart", "cookies"] }
# LLM 错误文案脱敏
regex = "1"
# 本地模型应用内下载：GitHub Releases 的 .tar.bz2 用 Rust 解压（Windows 无系统 tar/bzip2）
tar = "0.4"
bzip2 = "0.5"

[target.'cfg(windows)'.dependencies]
# 微信输入法语音：直接注入输入法进程；ToolHelp 只用于发现进程，Frida 负责 attach / 执行 agent
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
] }

[target.'cfg(windows)'.build-dependencies]
# 只下载并解包 Frida Core 静态库，不使用 bindgen，构建机无需安装 libclang。
frida-build = "0.17.2"

[features]
# 默认包含本地引擎；CI / 纯数据面构建可用 --no-default-features 跳过 CTranslate2 与 sherpa-onnx
default = ["local-engines"]
local-engines = ["dep:att-whisper", "dep:att-qwen"]
# 测试支撑（本地 LLM HTTP 桩），供下游 crate 的测试启用
test-support = []

[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }
