[package]
name = "att-core"
description = "ATT 领域内核：存储/设置/记录/迁移/事件总线（不依赖桌面框架，可 headless 测试）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process"] }
chrono = { workspace = true }
tracing = { workspace = true }
# Fernet 兼容加密：纯 Rust 规范实现（不用 fernet crate——它拖 openssl，
# Windows 分发不友好），与 Python cryptography 互操作由 fixture 测试锁定
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
# WAV 读写与时长解析（迁移阶段的音频错位修复）
hound = "3.5"
# 录音落盘压成 FLAC（纯 Rust 编码，不开并行 / serde）；claxon 解码，供离线评测读回录音
flacenc = { version = "0.5", default-features = false }
claxon = "0.4"
# 探测旧 Electron userData 目录（迁移 legacy desktop-settings.json）
dirs = "6"
# 豆包 SAUC 流式 ASR：WebSocket（native-tls：mac/Win 走系统 TLS，不引入 OpenSSL/aws-lc 构建依赖）
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
# 本地引擎：faster-whisper（CTranslate2/ct2rs）与 Qwen3-ASR（sherpa-onnx ONNX）
att-whisper = { path = "../att-whisper" }
att-qwen = { path = "../att-qwen" }
# LLM 网关：native-tls 与 WebSocket 同一套系统 TLS；system-proxy 读系统代理（与 Python httpx 走代理的行为对齐）
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "http2", "charset", "system-proxy", "multipart"] }
# LLM 错误文案脱敏
regex = "1"

[features]
# 测试支撑（本地 LLM HTTP 桩），供下游 crate 的测试启用
test-support = []

[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }
