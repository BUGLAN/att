[project]
name = "audio-to-text-backend"
version = "1.0.0"
description = "Backend runtime for the Audio to Text Electron application"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "python-multipart>=0.0.6",
  "aiofiles>=23.2.1",
  "websockets>=12.0",
  "pydub>=0.25.1",
  "faster-whisper>=1.0.0",
  "qwen-asr>=0.0.6; sys_platform == 'win32'",
  "qwen-asr[vllm]>=0.0.6; sys_platform != 'win32'",
  "torch==2.8.0+cu128; sys_platform == 'win32'",
  "httpx>=0.26.0",
  "tenacity>=8.2.3",
  "openai>=1.0.0",
  "anthropic>=0.18.0",
  "cryptography>=42.0.0",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.1.0",
  "python-dotenv>=1.0.0",
  "structlog>=24.1.0",
  "uuid6>=2024.1.12",
  "pycaw>=20181226; sys_platform == 'win32'",
  "llguidance>=1.7.0; sys_platform == 'win32'",
  "xgrammar>=0.1.33; sys_platform == 'win32'",
  "torch-c-dlpack-ext>=0.1.5",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
