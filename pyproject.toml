[project]
name = "audio-to-text-backend"
version = "1.0.0"
description = "Backend runtime for the Audio to Text Electron application"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "python-multipart>=0.0.6",
  "aiofiles>=23.2.1",
  "websockets>=12.0",
  "pydub>=0.25.1",
  "faster-whisper>=1.0.0",
  "qwen-asr>=0.0.6; sys_platform != 'linux'",
  "qwen-asr[vllm]>=0.0.6; sys_platform == 'linux'",
  "torch==2.8.0+cu128; sys_platform == 'win32'",
  # httpx 会读取系统/环境代理（macOS 上经 urllib.getproxies 读系统设置）。
  # 终端里设了 ALL_PROXY=socks5://... 时，缺少 socksio 会让 httpx 在构造
  # AsyncClient 时直接抛 ImportError —— 而 TextOptimizer 在启动期构造，
  # 结果是整个后端起不来。故显式带上 socks extra。
  "httpx[socks]>=0.26.0",
  "tenacity>=8.2.3",
  "openai>=1.0.0",
  "anthropic>=0.18.0",
  # LLM 统一接入层：一套接口调 100+ 服务商（模型名 = 前缀/模型串，见 docs/LLM配置模块重设计.md）。
  # 只在 app/llm/gateway.py 内部懒加载，避免 import 期拖慢后端启动。
  "litellm>=1.40.0",
  "cryptography>=42.0.0",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.1.0",
  "python-dotenv>=1.0.0",
  "structlog>=24.1.0",
  "uuid6>=2024.1.12",
  "pynput>=1.7.7",
  "pycaw>=20181226; sys_platform == 'win32'",
  "llguidance>=1.7.0; sys_platform == 'win32'",
  "xgrammar>=0.1.33; sys_platform == 'win32'",
  "torch-c-dlpack-ext>=0.1.5",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# pytest 基线配置（任务 T3：质量门禁）
# 仅新增配置段，未改动 dependencies / dependency-groups，不会引起 uv.lock 变更。
# 这样直接执行 `uv run python -m pytest`（不带路径）也会自动只收集 tests/。
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
