# ATT 质量门禁（前端 + Rust 核心）
#
# 前端：纯 Node 单元断言（纯函数），不需要显示器。
# Rust：att-core 的本地引擎依赖（CTranslate2 / sherpa-onnx）默认开启，CI 用
# `--no-default-features` 关闭后再跑 fmt / clippy / test；默认构建仍由本机
# `cargo test --workspace` 与 release.yml 的打包流程覆盖。

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# 同一分支的新提交取消仍在运行的旧任务，节省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: 前端门禁（Node 测试 + 构建）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: Node 单元测试
        # 走自研串行 runner：tests/ 下有手写 main() 的用例会 process.exit(0)，
        # 直接用 node --test 会被截断收集与汇总。
        run: npm run test:node

      - name: 前端构建
        run: npx vite build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  rust-core:
    name: Rust 门禁（不含本地引擎）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust 格式化检查
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy（core / server / hotkey，不含本地引擎）
        working-directory: src-tauri
        run: cargo clippy -p att-core -p att-server -p att-hotkey --no-default-features

      - name: Rust 测试（core / server / hotkey，不含本地引擎）
        working-directory: src-tauri
        run: cargo test -p att-core -p att-server -p att-hotkey --no-default-features
