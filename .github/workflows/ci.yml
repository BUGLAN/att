# ATT 质量门禁（前端 + Rust 全平台）
#
# 前端：纯 Node 单元断言（纯函数），不需要显示器。
# Rust：Linux 用 `--no-default-features` 检查核心 crate，Windows 覆盖平台专属代码，
# macOS 编译完整 att-app 并跑 app / audio 测试。所有 clippy 检查都把 warning 当错误。

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# 同一分支的新提交取消仍在运行的旧任务，节省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: 前端门禁（Node 测试 + 构建）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: Node 单元测试
        # 走自研串行 runner：tests/ 下有手写 main() 的用例会 process.exit(0)，
        # 直接用 node --test 会被截断收集与汇总。
        run: npm run test:node

      - name: 前端构建
        run: npx vite build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  rust-core:
    name: Rust 门禁（Linux，不含本地引擎）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装系统依赖
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libssl-dev pkg-config

      - name: Rust 格式化检查
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy（core / server / hotkey / qwen / audio）
        working-directory: src-tauri
        run: >-
          cargo clippy
          -p att-core -p att-server -p att-hotkey -p att-qwen -p att-audio
          --no-default-features --all-targets -- -D warnings

      - name: Rust 测试（core / server / hotkey / qwen / audio）
        working-directory: src-tauri
        run: >-
          cargo test
          -p att-core -p att-server -p att-hotkey -p att-qwen -p att-audio
          --no-default-features

  rust-windows:
    name: Rust 门禁（Windows 平台代码）
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy（Windows 专属 core / hotkey / qwen）
        working-directory: src-tauri
        run: >-
          cargo clippy
          -p att-core -p att-hotkey -p att-qwen
          --no-default-features --all-targets -- -D warnings

      - name: Rust 测试（qwen）
        working-directory: src-tauri
        run: cargo test -p att-qwen

  rust-macos:
    name: Rust 门禁（macOS，完整应用）
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy（完整工作区与 macOS 专属代码）
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust 测试（app / audio）
        working-directory: src-tauri
        run: cargo test -p att-app -p att-audio
