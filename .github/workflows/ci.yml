# ATT 质量门禁（前端）
#
# 用例全部是纯 Node 的单元断言（纯函数），不需要显示器、不需要 Rust 工具链，
# 因此用 ubuntu-latest 即可。
#
# Rust 侧（`cargo test --workspace`）依赖 CTranslate2 / sherpa-onnx 的本地编译与系统库，
# 托管 runner 上构建代价过高，目前由本机测试与 release.yml 的打包流程覆盖。

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# 同一分支的新提交取消仍在运行的旧任务，节省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: 前端门禁（Node 测试 + 构建）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: Node 单元测试
        # 走自研串行 runner：tests/ 下有手写 main() 的用例会 process.exit(0)，
        # 直接用 node --test 会被截断收集与汇总。
        run: npm run test:node

      - name: 前端构建
        run: npx vite build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
