# ATT 发布：推送 v* 标签时在 macOS / Windows 上打包 Tauri 应用，并把安装包挂到同名 GitHub Release。
#
#   macOS    aarch64-apple-darwin（Apple Silicon）→ .dmg 与 .app.tar.gz；未签名 / 未公证，
#            首次打开需在「系统设置 → 隐私与安全性」里放行
#   Windows  x86_64-pc-windows-msvc → NSIS 安装包（.exe）与 .msi；未签名，SmartScreen 会提示。
#            随包的 prompts/ 是中文文件名，MSI 必须用中文代码页（tauri.conf.json 的 wix.language = zh-CN）
#
# 构建耗时主要在本地 Whisper 引擎：att-whisper 依赖的 ct2rs 会用 CMake 从源码编译 CTranslate2
# （Windows 上还有 oneDNN），首次约 20–40 分钟；rust-cache 缓存 target 后会快很多。
# 两个平台都自带 CMake；Windows 的静态 CRT（+crt-static）由 src-tauri/.cargo/config.toml 提供。
# 模型文件不随包（见 docs/遗留与下线.md §5），安装后在设置页按提示下载。

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（如 v2.1.0，需已存在）'
        required: true
      ref:
        description: '用哪个提交 / 分支的代码打包（留空 = 标签本身；只修了打包配置时可填 main 补发安装包）'
        required: false

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: 打包 ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS（Apple Silicon）
            runner: macos-latest
            target: aarch64-apple-darwin
          - label: Windows（x64）
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      # 打包只用 Tauri；旧 Electron 依赖仍在 devDependencies 里，跳过它的二进制下载
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.inputs.tag || github.ref }}

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 准备 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}
          # 打包失败（多在最后的安装包环节）也保存编译缓存：Windows 从头编一次 CTranslate2 + oneDNN 要 40 分钟
          cache-on-failure: true

      - name: 安装前端依赖
        run: npm ci

      - name: 打包并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 显式用 npm 调 tauri：runner 的包管理器探测可能选错，仓库统一用 npm（package-lock.json）
          tauriScript: npm run tauri
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 落墨 ${{ env.RELEASE_TAG }}
          # productName 是中文，GitHub 会把附件名里的非 ASCII 字符替换掉：附件统一用拼音名
          releaseAssetNamePattern: Luomo_[version]_[arch][setup][ext]
          releaseBody: |
            ## 安装
            - **macOS（Apple Silicon）**：下载 `.dmg`。安装包未签名，首次打开若提示「无法验证开发者」，到「系统设置 → 隐私与安全性」点「仍要打开」。
              全局快捷键与自动粘贴需要在「隐私与安全性」里给本应用「输入监控」和「辅助功能」权限。
            - **Windows（x64）**：下载 `.exe`（推荐）或 `.msi`。安装包未签名，SmartScreen 提示时选「更多信息 → 仍要运行」。

            本地识别模型不随包，按设置页「识别引擎」的提示下载。
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
