<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频转文字 - 实时录音</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙</text></svg>">
</head>
<body>
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="sidebar-toggle" id="sidebarToggle" title="收起侧边栏">
                <span class="toggle-icon">«</span>
            </button>
            <div class="sidebar-logo">
                <span class="logo-icon">🎙</span>
                <span class="logo-text">ATT</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" data-page="home">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">首页</span>
            </a>
            <a href="#" class="nav-item" data-page="settings">
                <span class="nav-icon">⚙</span>
                <span class="nav-text">设置</span>
            </a>
        </nav>

        <!-- WebSocket 连接状态 -->
        <div class="sidebar-status">
            <div class="connection-status" id="connectionStatus">
                <span class="status-indicator disconnected"></span>
                <span class="status-text">未连接</span>
            </div>
            <div class="client-count" id="clientCount" style="display: none;">
                <span class="client-icon">👥</span>
                <span class="client-text">已连接: <span id="clientCountNum">1</span></span>
            </div>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content" id="mainContent">
        <div class="container">
            <!-- Header -->
            <header class="header">
                <h1>Audio to Text</h1>
                <p class="subtitle">实时录音 · AI优化 · 双击复制</p>
            </header>

            <!-- Recorder Section -->
            <section class="recorder-section">
                <div class="recorder-controls">
                    <button id="recordBtn" class="record-btn">
                        <span class="btn-icon">●</span>
                        <span class="btn-text">开始录音</span>
                    </button>
                    <div class="recording-status" id="recordingStatus">
                        <span class="status-dot"></span>
                        <span class="status-text">准备就绪</span>
                        <span class="duration" id="duration">00:00</span>
                    </div>
                </div>
            </section>

            <!-- Transcription Section (hidden for async workflow) -->
            <section class="transcription-section" style="display: none;">
                <div class="section-header">
                    <h2>实时转写</h2>
                    <span class="transcription-time" id="transcriptionTime">耗时: 0.00s</span>
                    <div class="section-actions">
                        <button id="optimizeBtn" class="btn btn-secondary" disabled>
                            AI优化
                        </button>
                        <button id="copyBtn" class="btn btn-secondary" disabled>
                            复制
                        </button>
                    </div>
                </div>
                <div class="transcription-content">
                    <textarea
                        id="textDisplay"
                        class="text-display-editable"
                        placeholder="点击「开始录音」后，转写文本将在此显示...&#10;&#10;双击可复制到剪贴板"
                        rows="8"
                    ></textarea>
                </div>
            </section>

            <!-- Records Section -->
            <section class="records-section">
                <div class="section-header">
                    <h2>历史录音</h2>
                    <div class="section-header-right">
                        <span class="record-count" id="recordCount">0 条记录</span>
                        <button class="header-settings-btn" id="headerSettingsBtn" title="设置">⚙</button>
                    </div>
                </div>
                <div class="records-list" id="recordsList">
                    <p class="placeholder">暂无录音记录</p>
                </div>
                <!-- Select Mode Toolbar (hidden by default) -->
                <div class="select-toolbar" id="selectToolbar" style="display: none;">
                    <label class="select-all-label">
                        <input type="checkbox" id="selectAllCheckbox">
                        <span>全选</span>
                    </label>
                    <button class="btn-delete-selected" id="deleteSelectedBtn">删除选中</button>
                    <button class="btn-cancel-select" id="cancelSelectBtn">取消</button>
                </div>
            </section>
        </div>
    </main>

    <!-- Settings Popup (positioned via JS) -->
    <div class="settings-popup" id="settingsPopup" style="display: none;">
        <div class="settings-popup-body">
            <button class="settings-action select-mode-btn" id="selectModeBtn">选择多条删除</button>
        </div>
    </div>

    <!-- Settings Page -->
    <div class="settings-page" id="settingsPage" style="display: none;">
        <div class="container">
            <header class="header">
                <h1>设置</h1>
                <p class="subtitle">配置您的偏好</p>
            </header>

            <section class="settings-section">
                <div class="settings-group">
                    <h3 class="settings-group-title">语音识别</h3>

                    <div class="setting-item">
                        <div class="setting-info">
                            <span class="setting-label">识别模型</span>
                            <span class="setting-desc">较大的模型准确率更高，但速度更慢</span>
                        </div>
                        <select class="setting-select" id="settingWhisperModel">
                            <option value="tiny">tiny (最快)</option>
                            <option value="base">base</option>
                            <option value="small">small</option>
                            <option value="medium">medium</option>
                            <option value="large-v3">large-v3 (最准确)</option>
                        </select>
                    </div>

                    <div class="setting-item">
                        <div class="setting-info">
                            <span class="setting-label">计算设备</span>
                            <span class="setting-desc">选择用于语音识别的硬件</span>
                        </div>
                        <select class="setting-select" id="settingWhisperDevice">
                            <option value="auto">自动选择</option>
                            <option value="cuda">CUDA (NVIDIA GPU)</option>
                            <option value="cpu">CPU</option>
                        </select>
                    </div>
                </div>

                <div class="settings-group">
                    <h3 class="settings-group-title">录音设置</h3>

                    <div class="setting-item">
                        <div class="setting-info">
                            <span class="setting-label">录音时暂停其他音频</span>
                            <span class="setting-desc">录音时自动暂停 Spotify、Music 等播放</span>
                        </div>
                        <label class="toggle-switch">
                            <input type="checkbox" id="settingPauseAudio">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>

                    <div class="setting-item">
                        <div class="setting-info">
                            <span class="setting-label">自动 AI 优化</span>
                            <span class="setting-desc">转写完成后自动优化文本</span>
                        </div>
                        <label class="toggle-switch">
                            <input type="checkbox" id="settingAutoOptimize">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>

                    <div class="setting-item">
                        <div class="setting-info">
                            <span class="setting-label">录音快捷键</span>
                            <span class="setting-desc">点击输入框后按下组合键</span>
                        </div>
                        <div class="hotkey-input-wrapper">
                            <input
                                type="text"
                                id="settingHotkey"
                                class="hotkey-input"
                                readonly
                                placeholder="点击输入快捷键..."
                            >
                            <button class="hotkey-reset-btn" id="resetHotkeyBtn" title="重置为默认">↺</button>
                        </div>
                    </div>
                </div>

                <div class="settings-actions">
                    <button class="btn btn-primary" id="saveSettingsBtn">保存设置</button>
                </div>
            </section>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast" style="display: none;"></div>

    <script src="/static/js/recorder.js"></script>
    <script src="/static/js/websocket.js"></script>
    <script src="/static/js/settings.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
