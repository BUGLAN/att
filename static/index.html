<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频转文字 - 实时录音</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙</text></svg>">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>Audio to Text</h1>
            <p class="subtitle">实时录音 · AI优化 · 双击复制</p>
        </header>

        <!-- Recorder Section -->
        <section class="recorder-section">
            <div class="recorder-controls">
                <button id="recordBtn" class="record-btn">
                    <span class="btn-icon">●</span>
                    <span class="btn-text">开始录音</span>
                </button>
                <div class="recording-status" id="recordingStatus">
                    <span class="status-dot"></span>
                    <span class="status-text">准备就绪</span>
                    <span class="duration" id="duration">00:00</span>
                </div>
            </div>
        </section>

        <!-- Transcription Section -->
        <section class="transcription-section">
            <div class="section-header">
                <h2>实时转写</h2>
                <div class="section-actions">
                    <button id="optimizeBtn" class="btn btn-secondary" disabled>
                        AI优化
                    </button>
                    <button id="copyBtn" class="btn btn-secondary" disabled>
                        复制
                    </button>
                </div>
            </div>
            <div class="transcription-content">
                <textarea
                    id="textDisplay"
                    class="text-display-editable"
                    placeholder="点击「开始录音」后，转写文本将在此显示...&#10;&#10;双击可复制到剪贴板"
                    rows="8"
                ></textarea>
            </div>
        </section>

        <!-- Records Section -->
        <section class="records-section">
            <div class="section-header">
                <h2>历史录音</h2>
                <span class="record-count" id="recordCount">0 条记录</span>
            </div>
            <div class="records-list" id="recordsList">
                <p class="placeholder">暂无录音记录</p>
            </div>
        </section>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast" style="display: none;"></div>

    <script src="/static/js/recorder.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
